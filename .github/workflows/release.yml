name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override, for example 1.0.1.0. Defaults to build.yaml.'
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: Jellyfin.Plugin.PreferredArtwork/Jellyfin.Plugin.PreferredArtwork.csproj
  PACKAGE_ID: preferred-artwork-plugin

jobs:
  release:
    name: Build, release, and update plugin repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build metadata
        id: metadata
        run: python .github/scripts/read-build-yaml.py build.yaml

      - name: Resolve version
        id: version
        shell: bash
        run: |
          build_version="${{ steps.metadata.outputs.version }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            tag="v${version}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${build_version}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          IFS='.' read -r -a parts <<< "$version"
          while [ "${#parts[@]}" -lt 4 ]; do
            parts+=("0")
          done
          normalized="${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]}"
          if [ "${normalized}" != "${build_version}" ]; then
            echo "Release version ${normalized} does not match build.yaml version ${build_version}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${normalized}" >> "$GITHUB_OUTPUT"
          echo "asset=${PACKAGE_ID}-${normalized}.zip" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: >
          dotnet build "$PROJECT_PATH"
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-build --output dist/plugin

      - name: Package
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ${{ steps.metadata.outputs.name }} ${{ steps.version.outputs.version }}

          ${{ steps.metadata.outputs.changelog }}
          EOF
          cd dist/plugin
          zip -r "../${{ steps.version.outputs.asset }}" .
          cd ..
          md5sum "${{ steps.version.outputs.asset }}" | awk '{print $1}' > "${{ steps.version.outputs.asset }}.md5"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.version.outputs.tag }}" \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file release-notes.md
            gh release upload "${{ steps.version.outputs.tag }}" \
              "dist/${{ steps.version.outputs.asset }}" \
              "dist/${{ steps.version.outputs.asset }}.md5" \
              --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              "dist/${{ steps.version.outputs.asset }}" \
              "dist/${{ steps.version.outputs.asset }}.md5" \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file release-notes.md
          fi

      - name: Generate Jellyfin repository manifest
        env:
          CHANGELOG: ${{ steps.metadata.outputs.changelog }}
        shell: bash
        run: |
          mkdir -p public
          git fetch origin gh-pages || true
          if git show origin/gh-pages:manifest.json > public/manifest.json 2>/dev/null; then
            echo "Using existing gh-pages manifest"
          else
            echo "[]" > public/manifest.json
          fi

          python .github/scripts/update-jellyfin-manifest.py \
            --manifest public/manifest.json \
            --guid "${{ steps.metadata.outputs.guid }}" \
            --name "${{ steps.metadata.outputs.name }}" \
            --owner "${{ steps.metadata.outputs.owner }}" \
            --category "${{ steps.metadata.outputs.category }}" \
            --overview "${{ steps.metadata.outputs.overview }}" \
            --description "${{ steps.metadata.outputs.description }}" \
            --version "${{ steps.version.outputs.version }}" \
            --target-abi "${{ steps.metadata.outputs.targetAbi }}" \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.version.outputs.asset }}" \
            --checksum "$(cat "dist/${{ steps.version.outputs.asset }}.md5")" \
            --changelog "$CHANGELOG"

          cat > public/README.md <<EOF
          # Preferred Artwork Jellyfin Plugin Repository

          Add this URL in Jellyfin Dashboard -> Plugins -> Repositories:

          \`\`\`
          https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/manifest.json
          \`\`\`
          EOF

      - name: Publish Jellyfin repository manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add gh-pages origin/gh-pages
          else
            git worktree add --detach gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          cp public/manifest.json gh-pages/manifest.json
          cp public/README.md gh-pages/README.md

          cd gh-pages
          git add manifest.json README.md
          if git diff --cached --quiet; then
            echo "No manifest changes to publish"
          else
            git commit -m "Update plugin repository for ${{ steps.version.outputs.tag }}"
            git push origin HEAD:gh-pages
          fi
